<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f4ef"><title>光柵光譜儀製作（114）</title><link rel="stylesheet" href="assets/styles.css"></head><body>
<header class="bar"><h1 class="title">光柵光譜儀製作<span class="edition">114 版 · PPT 網頁版</span></h1><div class="tools"><button id="toc" aria-haspopup="dialog">頁面目錄</button><button id="textBtn" aria-haspopup="dialog">文字</button><button id="zoom" aria-pressed="false">放大圖片</button><button id="full">全螢幕</button></div></header>
<main><div class="page-heading"><h2 id="currentTitle"></h2><small id="gestureHint">左右滑動翻頁 · 點兩下放大</small></div><section class="stage" id="stage" aria-label="簡報頁面"><div class="frame" id="frame"><img id="slide" width="1920" height="1080" alt="" decoding="async"><span id="status" role="status"></span></div><button class="fullscreen-exit" id="exitFull">離開全螢幕</button></section>
<nav class="nav" aria-label="翻頁"><button id="prev">← 上一頁</button><div class="progress-line" id="progressLine"></div><div class="nav-middle"><label for="pages" class="sr">選擇頁面</label><select id="pages"></select><span class="count" id="count" aria-live="polite"></span></div><button id="next" class="next">下一頁 →</button></nav>
<div class="details"><p class="hint">左右滑動或按按鈕翻頁。看不清楚時可放大圖片，或展開本頁文字。iPad 橫放可看得更大。</p><details><summary>本頁文字</summary><div id="pageText"></div></details></div></main>
<div class="zoom-control" id="zoomControl" hidden><button id="minus" aria-label="縮小">−</button><output id="zoomValue">150%</output><button id="plus" aria-label="放大">＋</button><button id="fit">適合畫面</button></div>
<dialog id="tocDialog" aria-labelledby="tocTitle"><header class="dialog-bar"><div><h2 id="tocTitle">頁面目錄</h2><p>依原 PPT 順序 · 點選縮圖跳到該頁</p></div><button id="closeToc">關閉</button></header><div class="thumb-grid" id="thumbGrid"></div></dialog>
<dialog id="textDialog" class="text-dialog" aria-labelledby="textTitle"><header class="dialog-bar"><div><h2 id="textTitle">本頁文字</h2><p id="textPage"></p></div><button id="closeText">關閉</button></header><div class="text-body" id="readText"></div></dialog>
<script src="assets/slides.js"></script>
<script src="assets/app.js"></script></body></html>
